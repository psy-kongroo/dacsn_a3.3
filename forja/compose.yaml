
services:

  forgejo:
    image: codeberg.org/forgejo/forgejo:17
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000

      # Base de datos
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: bd:5432
      FORGEJO__database__NAME: ${NOMBRE_BD}
      FORGEJO__database__USER: ${USUARIO_BD}
      FORGEJO__database__PASSWD: ${CONTRASENA_BD:?Falta CONTRASENA_BD}

      # Servidor
      FORGEJO__server__DOMAIN: ${DIRECCION:?Falta DIRECCION}
      FORGEJO__server__ROOT_URL: http://${DIRECCION}:${PUERTO:-3000}/
      FORGEJO__server__SSH_PORT: ${PUERTO_SSH:-2222}
      FORGEJO__server__SSH_LISTEN_PORT: 22

      # Seguridad
      FORGEJO__security__INSTALL_LOCK: "true"

      # Correo
      FORGEJO__mailer__ENABLED: "true"
      FORGEJO__mailer__PROTOCOL: smtp
      FORGEJO__mailer__SMTP_ADDR: correo
      FORGEJO__mailer__SMTP_PORT: 1025
      FORGEJO__mailer__FROM: "Forgejo <forgejo@dacsn.local>"

      # Caché
      FORGEJO__cache__ADAPTER: redis
      FORGEJO__cache__HOST: redis://:${REDIS_CONTRASENA:?Falta REDIS_CONTRASENA}@cache:6379/0

      # Sesiones
      FORGEJO__session__PROVIDER: redis
      FORGEJO__session__PROVIDER_CONFIG: redis://:${REDIS_CONTRASENA}@cache:6379/0

      # Cola de tareas
      FORGEJO__queue__TYPE: redis
      FORGEJO__queue__CONN_STR: redis://:${REDIS_CONTRASENA}@cache:6379/0

    volumes:
      - forgejo-datos:/data

    ports:
      - "${PUERTO:-3000}:3000"
      - "${PUERTO_SSH:-2222}:22"

    networks:
      - interna

    depends_on:
      bd:
        condition: service_healthy
      cache:
        condition: service_healthy
      correo:
        condition: service_started


  bd:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${NOMBRE_BD}
      POSTGRES_USER: ${USUARIO_BD}
      POSTGRES_PASSWORD: ${CONTRASENA_BD:?Falta CONTRASENA_BD}

    volumes:
      - bd-datos:/var/lib/postgresql

    networks:
      - interna

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10


  cache:
    image: redis:7.2
    restart: unless-stopped

    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]

    environment:
      REDIS_PASSWORD: ${REDIS_CONTRASENA:?Falta REDIS_CONTRASENA}

    volumes:
      - cache-datos:/data

    networks:
      - interna

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10


  correo:
    image: axllent/mailpit:v1.34.0
    restart: unless-stopped

    ports:
      - "${PUERTO_CORREO:-8025}:8025"

    networks:
      - interna


networks:
  interna:


volumes:
  forgejo-datos:
  bd-datos:
  cache-datos:
